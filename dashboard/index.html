<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechTudo Jogos — Dashboard</title>

  <!-- Bootstrap 5.3.3 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons 1.11.3 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <!-- Chart.js 4.4.4 -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
    integrity="sha256-oVuCFnMFR+LFzGPnSODW8EL4wFvSHiPAjVDolZYj0Y="
    crossorigin="anonymous"
  ></script>

  <style>
    body {
      background-color: #f8f9fa;
    }
    .kpi-value {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .kpi-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .chart-container {
      position: relative;
      height: 320px;
    }
    .chart-container-wide {
      position: relative;
      height: 260px;
    }
    #error-toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      min-width: 320px;
    }
    .table th {
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-joystick me-2"></i>TechTudo Jogos — Dashboard
      </span>
      <span class="text-secondary small" id="last-update"></span>
    </div>
  </nav>

  <div class="container-xl">

    <!-- KPI Cards -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-newspaper fs-2 text-primary"></i>
            <div>
              <div class="kpi-value text-primary" id="kpi-total">—</div>
              <div class="kpi-label text-muted">Total de Notícias</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-person-lines-fill fs-2 text-success"></i>
            <div>
              <div class="kpi-value text-success" id="kpi-autores">—</div>
              <div class="kpi-label text-muted">Autores Únicos</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-tags-fill fs-2 text-warning"></i>
            <div>
              <div class="kpi-value text-warning" id="kpi-categorias">—</div>
              <div class="kpi-label text-muted">Categorias</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <i class="bi bi-clock-history fs-2 text-info"></i>
            <div>
              <div class="kpi-value text-info fs-5" id="kpi-ultima-coleta">—</div>
              <div class="kpi-label text-muted">Última Coleta</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-4">
            <label for="busca" class="form-label small fw-semibold">Busca</label>
            <input
              type="text"
              id="busca"
              class="form-control"
              placeholder="Pesquisar por título…"
            />
          </div>
          <div class="col-6 col-md-3">
            <label for="cat-filter" class="form-label small fw-semibold">Categoria</label>
            <select id="cat-filter" class="form-select">
              <option value="">Todas</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label for="autor-filter" class="form-label small fw-semibold">Autor</label>
            <select id="autor-filter" class="form-select">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="col-12 col-md-2 d-grid">
            <button id="btn-buscar" class="btn btn-primary">
              <i class="bi bi-search me-1"></i>Buscar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts Row 1 -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-white border-0 fw-semibold">
            <i class="bi bi-bar-chart-horizontal-fill me-1 text-primary"></i>Top 10 Autores
          </div>
          <div class="card-body">
            <div class="chart-container">
              <canvas id="chart-autores"></canvas>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-white border-0 fw-semibold">
            <i class="bi bi-pie-chart-fill me-1 text-warning"></i>Distribuição por Categoria
          </div>
          <div class="card-body d-flex justify-content-center align-items-center">
            <div class="chart-container">
              <canvas id="chart-categorias"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts Row 2 — Timeline -->
    <div class="row g-3 mb-4">
      <div class="col-12">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white border-0 fw-semibold">
            <i class="bi bi-graph-up me-1 text-success"></i>Notícias por Dia (últimos 7 dias)
          </div>
          <div class="card-body">
            <div class="chart-container-wide">
              <canvas id="chart-timeline"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-header bg-white border-0 fw-semibold">
        <i class="bi bi-table me-1 text-secondary"></i>Notícias Coletadas
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="tabela-noticias">
            <thead class="table-light">
              <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Categoria</th>
                <th>Data Publicação</th>
              </tr>
            </thead>
            <tbody id="tabela-body">
              <tr>
                <td colspan="4" class="text-center text-muted py-4">Carregando…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- Pagination -->
      <div class="card-footer bg-white border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span class="text-muted small" id="pagination-info">—</span>
        <div class="d-flex gap-2">
          <button id="btn-anterior" class="btn btn-sm btn-outline-secondary" disabled>
            <i class="bi bi-chevron-left"></i> Anterior
          </button>
          <button id="btn-proximo" class="btn btn-sm btn-outline-secondary" disabled>
            Próximo <i class="bi bi-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Error Toast -->
  <div id="error-toast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="error-toast-message">Erro ao comunicar com a API.</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
    </div>
  </div>

  <!-- Bootstrap 5.3.3 JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmKBCOaFo8ciZKwHAVCQbmqfgvJT"
    crossorigin="anonymous"
  ></script>

  <script>
    'use strict';

    // -------------------------------------------------------------------------
    // Configuration
    // -------------------------------------------------------------------------
    const API_BASE = 'http://localhost:8000';

    // -------------------------------------------------------------------------
    // State
    // -------------------------------------------------------------------------
    window.currentPage = 1;
    window.totalPages = 1;

    // Chart instances (kept so they can be destroyed on re-render)
    let chartAutores = null;
    let chartCategorias = null;
    let chartTimeline = null;

    // -------------------------------------------------------------------------
    // Utilities
    // -------------------------------------------------------------------------
    function showError(message) {
      const toastEl = document.getElementById('error-toast');
      document.getElementById('error-toast-message').textContent = message;
      const toast = new bootstrap.Toast(toastEl, { delay: 5000 });
      toast.show();
    }

    async function apiFetch(path) {
      const url = API_BASE + path;
      let response;
      try {
        response = await fetch(url);
      } catch (err) {
        throw new Error(`Falha de rede ao acessar ${url}: ${err.message}`);
      }
      if (!response.ok) {
        throw new Error(`Erro ${response.status} ao acessar ${url}`);
      }
      return response.json();
    }

    function formatDate(isoString) {
      if (!isoString) return '—';
      try {
        return new Date(isoString).toLocaleDateString('pt-BR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
        });
      } catch {
        return isoString;
      }
    }

    function formatDateTime(isoString) {
      if (!isoString) return '—';
      try {
        return new Date(isoString).toLocaleString('pt-BR');
      } catch {
        return isoString;
      }
    }

    // -------------------------------------------------------------------------
    // KPI Cards
    // -------------------------------------------------------------------------
    async function loadStats() {
      try {
        const stats = await apiFetch('/noticias/stats');
        document.getElementById('kpi-total').textContent =
          stats.total !== undefined ? stats.total.toLocaleString('pt-BR') : '—';
        document.getElementById('kpi-autores').textContent =
          stats.unique_authors !== undefined ? stats.unique_authors : '—';
        document.getElementById('kpi-categorias').textContent =
          stats.unique_categories !== undefined ? stats.unique_categories : '—';
        document.getElementById('kpi-ultima-coleta').textContent =
          formatDateTime(stats.last_collected_at);
        document.getElementById('last-update').textContent =
          'Atualizado em ' + new Date().toLocaleTimeString('pt-BR');
      } catch (err) {
        showError('Não foi possível carregar estatísticas: ' + err.message);
      }
    }

    // -------------------------------------------------------------------------
    // Filter selects
    // -------------------------------------------------------------------------
    async function loadFilters() {
      try {
        const [categorias, autores] = await Promise.all([
          apiFetch('/noticias/categorias'),
          apiFetch('/noticias/autores'),
        ]);

        const catSel = document.getElementById('cat-filter');
        categorias.forEach((c) => {
          if (!c) return;
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          catSel.appendChild(opt);
        });

        const autorSel = document.getElementById('autor-filter');
        autores.forEach((a) => {
          if (!a) return;
          const opt = document.createElement('option');
          opt.value = a;
          opt.textContent = a;
          autorSel.appendChild(opt);
        });
      } catch (err) {
        showError('Não foi possível carregar filtros: ' + err.message);
      }
    }

    // -------------------------------------------------------------------------
    // Charts
    // -------------------------------------------------------------------------
    const PALETTE = [
      '#4e79a7', '#f28e2b', '#e15759', '#76b7b2', '#59a14f',
      '#edc948', '#b07aa1', '#ff9da7', '#9c755f', '#bab0ac',
    ];

    async function loadCharts() {
      let items = [];
      try {
        const data = await apiFetch('/noticias?size=500');
        items = data.items || [];
      } catch (err) {
        showError('Não foi possível carregar dados para os gráficos: ' + err.message);
        return;
      }

      buildChartAutores(items);
      buildChartCategorias(items);
      buildChartTimeline(items);
    }

    function buildChartAutores(items) {
      // Count articles per author, show top 10
      const counts = {};
      items.forEach((item) => {
        const a = item.author || 'Desconhecido';
        counts[a] = (counts[a] || 0) + 1;
      });
      const sorted = Object.entries(counts)
        .sort((x, y) => y[1] - x[1])
        .slice(0, 10);
      const labels = sorted.map(([name]) => name);
      const values = sorted.map(([, count]) => count);

      const ctx = document.getElementById('chart-autores').getContext('2d');
      if (chartAutores) chartAutores.destroy();
      chartAutores = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              label: 'Artigos',
              data: values,
              backgroundColor: PALETTE,
              borderWidth: 0,
            },
          ],
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
          },
          scales: {
            x: { ticks: { precision: 0 } },
          },
        },
      });
    }

    function buildChartCategorias(items) {
      const counts = {};
      items.forEach((item) => {
        const c = item.category || 'Sem categoria';
        counts[c] = (counts[c] || 0) + 1;
      });
      const labels = Object.keys(counts);
      const values = Object.values(counts);

      const ctx = document.getElementById('chart-categorias').getContext('2d');
      if (chartCategorias) chartCategorias.destroy();
      chartCategorias = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [
            {
              data: values,
              backgroundColor: PALETTE,
              borderWidth: 2,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 12 } },
          },
        },
      });
    }

    function buildChartTimeline(items) {
      // Build last-7-days date range
      const today = new Date();
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        days.push(d.toISOString().slice(0, 10));
      }

      const counts = {};
      days.forEach((d) => (counts[d] = 0));
      items.forEach((item) => {
        const raw = item.published_date || item.collected_at || '';
        const day = raw.slice(0, 10);
        if (day in counts) counts[day]++;
      });

      const labels = days.map((d) =>
        new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', {
          day: '2-digit',
          month: '2-digit',
        })
      );
      const values = days.map((d) => counts[d]);

      const ctx = document.getElementById('chart-timeline').getContext('2d');
      if (chartTimeline) chartTimeline.destroy();
      chartTimeline = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Notícias',
              data: values,
              fill: true,
              backgroundColor: 'rgba(78,121,167,0.15)',
              borderColor: '#4e79a7',
              pointBackgroundColor: '#4e79a7',
              tension: 0.3,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
          },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0 } },
          },
        },
      });
    }

    // -------------------------------------------------------------------------
    // Table + Pagination
    // -------------------------------------------------------------------------
    async function loadTable(page = 1) {
      window.currentPage = page;

      const busca = document.getElementById('busca').value.trim();
      const categoria = document.getElementById('cat-filter').value;
      const autor = document.getElementById('autor-filter').value;

      const params = new URLSearchParams({ page, size: 20 });
      if (busca) params.set('busca', busca);
      if (categoria) params.set('categoria', categoria);
      if (autor) params.set('autor', autor);

      const tbody = document.getElementById('tabela-body');
      tbody.innerHTML =
        '<tr><td colspan="4" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2"></span>Carregando…</td></tr>';

      try {
        const data = await apiFetch('/noticias?' + params.toString());
        const items = data.items || [];
        const total = data.total || 0;
        const size = data.size || 20;
        window.totalPages = Math.max(1, Math.ceil(total / size));

        if (items.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="4" class="text-center text-muted py-4">Nenhuma notícia encontrada.</td></tr>';
        } else {
          tbody.innerHTML = items
            .map(
              (item) => `
            <tr>
              <td>
                ${
                  item.link
                    ? `<a href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title || '—')}</a>`
                    : escapeHtml(item.title || '—')
                }
              </td>
              <td>${escapeHtml(item.author || '—')}</td>
              <td>${item.category ? `<span class="badge text-bg-secondary">${escapeHtml(item.category)}</span>` : '—'}</td>
              <td>${formatDate(item.published_date)}</td>
            </tr>`
            )
            .join('');
        }

        // Update pagination controls
        document.getElementById('pagination-info').textContent =
          `Página ${window.currentPage} de ${window.totalPages} — ${total.toLocaleString('pt-BR')} registros`;
        document.getElementById('btn-anterior').disabled = window.currentPage <= 1;
        document.getElementById('btn-proximo').disabled =
          window.currentPage >= window.totalPages;
      } catch (err) {
        tbody.innerHTML =
          '<tr><td colspan="4" class="text-center text-danger py-4">Erro ao carregar dados.</td></tr>';
        showError('Erro ao carregar tabela: ' + err.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // -------------------------------------------------------------------------
    // Event Listeners
    // -------------------------------------------------------------------------
    document.getElementById('btn-buscar').addEventListener('click', () => loadTable(1));
    document.getElementById('busca').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadTable(1);
    });
    document.getElementById('btn-anterior').addEventListener('click', () => {
      if (window.currentPage > 1) loadTable(window.currentPage - 1);
    });
    document.getElementById('btn-proximo').addEventListener('click', () => {
      if (window.currentPage < window.totalPages) loadTable(window.currentPage + 1);
    });

    // -------------------------------------------------------------------------
    // Bootstrap re-filter on select change
    // -------------------------------------------------------------------------
    document.getElementById('cat-filter').addEventListener('change', () => loadTable(1));
    document.getElementById('autor-filter').addEventListener('change', () => loadTable(1));

    // -------------------------------------------------------------------------
    // Bootstrap
    // -------------------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      Promise.all([loadStats(), loadFilters(), loadCharts(), loadTable(1)]);
    });
  </script>
</body>
</html>
